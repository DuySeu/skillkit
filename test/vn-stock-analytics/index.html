<!doctype html>
<html lang="vi" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#131B1A" />
    <title>VN Stock Analytics — Phân tích thị trường chứng khoán Việt Nam</title>
    <meta
      name="description"
      content="Phân tích thị trường chứng khoán Việt Nam với bảng giá HOSE, HNX, UPCOM và trợ lý AI hiểu tiếng Việt."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <script>
      /* Dark is the default (Night Desk). Resolve the stored preference before
         first paint so there is no flash of the light theme. */
      (function () {
        try {
          var t = localStorage.getItem('vnsa.theme') || 'dark';
          document.documentElement.classList.toggle('dark', t === 'dark');
          document.documentElement.style.colorScheme = t;
        } catch (e) {
          /* localStorage blocked — the `dark` class on <html> already stands. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
